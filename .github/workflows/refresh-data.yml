name: Refresh UN Transcripts data

on:
  schedule:
    # every 6 hours — adjust to taste (cron is UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit data/crises.json back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ingestion
        run: node scripts/ingest.js

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crises.json
          git diff --cached --quiet || git commit -m "Refresh UN Transcripts data [automated]"
          git push
