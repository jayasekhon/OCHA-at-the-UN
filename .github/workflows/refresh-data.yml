name: Refresh UN Transcripts data

on:
  schedule:
    # every 6 hours — adjust to taste (cron is UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      debug_shape:
        description: "Print raw API response shape to the log (for diagnosing field-name mismatches)"
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit data/crises.json back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ingestion
        run: node scripts/ingest.js
        env:
          INGEST_DEBUG_SHAPE: ${{ inputs.debug_shape && '1' || '0' }}

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crises.json
          git diff --cached --quiet || git commit -m "Refresh UN Transcripts data [automated]"
          git push
